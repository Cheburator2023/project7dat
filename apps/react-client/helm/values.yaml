# Default values for data-lineage-frontend.

pullSecret: ci-dos

replicaCount: 1

image:
  repository: nexus-ci.corp.dev.vtb/sumd-docker-lib/data-lineage-frontend
  tag: v1.0.0
  pullPolicy: Always

resources:
  requests:
    cpu: "300m"
    memory: "1000Mi"
  limits:
    cpu: "600m"
    memory: "1000Mi"

secretName: ingress-tls

ingress:
  enabled: true
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: data-lineage-frontend-ds1-lpad01-sumd-team-sumcore-system.apps.ds1-lpad01.corp.dev.vtb
      paths:
        - pathType: ImplementationSpecific
          backend:
            service:
              name: data-lineage-frontend
              port:
                number: 8080
  tls:
    - secretName: ingress-tls
      hosts:
        - data-lineage-frontend-ds1-lpad01-sumd-team-sumcore-system.apps.ds1-lpad01.corp.dev.vtb


###Выбор worker ноды без GPU
